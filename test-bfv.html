<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFV-Test</title>
<style>
  body{font-family:system-ui,sans-serif;background:#F5F6F8;color:#1E2530;margin:0;padding:24px 16px;line-height:1.5}
  h1{font-size:22px;margin:0 0 4px}
  p{margin:0 0 16px;color:#4F5966}
  .r{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .r b{display:block;font-size:17px}
  .ok{color:#23804F}.no{color:#C9302C}.wait{color:#8A93A0}
  #w{background:#fff;border-radius:16px;overflow:hidden}
</style>
</head>
<body>
<h1>BFV-Verbindungstest</h1>
<p>Diese Seite prüft, ob die App die Jugenddaten vom BFV abrufen darf. Sie wird nach dem Test wieder entfernt.</p>
<div class="r"><b id="t1" class="wait">Daten-Abruf: wird geprüft …</b><span id="d1"></span></div>
<div class="r"><b>BFV-Widget:</b><span>Hier sollte unten die Tabelle der B-Junioren erscheinen.</span></div>
<div id="w"></div>
<script>
const B = "https://widget-prod.bfv.de/api/service/widget/v1/";
(async () => {
  const t = document.getElementById("t1"), d = document.getElementById("d1");
  try {
    const r = await fetch(B + "team/01L5HD4L6K000000VV0AG80NVTB5JGKG/matches");
    const j = await r.json();
    t.textContent = "✓ Daten-Abruf klappt"; t.className = "ok";
    d.textContent = `${j.data.matches.length} Spiele der B-Junioren gefunden (${j.data.team.competitionName}).`;
  } catch (e) {
    t.textContent = "✗ Daten-Abruf gesperrt"; t.className = "no";
    d.textContent = "Der BFV lässt die App-Adresse (noch) nicht zu. Nach der Registrierung kann es ein paar Minuten dauern.";
  }
})();
</script>
<script src="https://widget-prod.bfv.de/widget/widgetresource/widgetjs"></script>
<script>
  try {
    BFVWidget.HTML5.zeigeWettbewerb("031K6B6RI8000006VS5489BTVSRD0UH9-G", "w",
      { height: "420", width: "100%", selectedTab: BFVWidget.HTML5.wettbewerbTabs.tabelle });
  } catch (e) { document.getElementById("w").textContent = "Widget-Skript konnte nicht geladen werden."; }
</script>
</body>
</html>
